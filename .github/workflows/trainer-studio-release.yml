name: Publish Trainer Studio

on:
  push:
    branches:
      - main
    tags:
      - "trainer-studio-v*"
    paths:
      - "trainer-studio/**"
      - ".github/workflows/trainer-studio-release.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run core tests
        run: >
          dotnet run --project
          .\trainer-studio\tests\TrainerStudio.Core.Tests\TrainerStudio.Core.Tests.csproj
          -c Release

      - name: Verify rendered Windows theme
        run: >
          dotnet run --project
          .\trainer-studio\tests\TrainerStudio.Theme.Tests\TrainerStudio.Theme.Tests.csproj
          -c Release -- .\release\theme-tests

      - name: Run streaming scanner tests
        run: dotnet run --project .\trainer-studio\tests\TrainerStudio.Scanner.Tests\TrainerStudio.Scanner.Tests.csproj -c Release

      - name: Run stable reference and pointer tests
        run: dotnet run --project .\trainer-studio\tests\TrainerStudio.Reference.Tests\TrainerStudio.Reference.Tests.csproj -c Release

      - name: Verify real x64 process access
        run: dotnet run --project .\trainer-studio\tests\TrainerStudio.Windows.Tests\TrainerStudio.Windows.Tests.csproj -c Release

      - name: Build ordinary x86 memory fixture
        run: >
          dotnet publish .\trainer-studio\tests\TrainerStudio.Windows.Tests\TrainerStudio.Windows.Tests.csproj
          -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false -o .\release\x86-fixture

      - name: Verify x64 access to x86 process
        shell: pwsh
        run: |
          $env:TRAINER_STUDIO_FIXTURE_EXE = (Resolve-Path .\release\x86-fixture\TrainerStudio.Windows.Tests.exe).Path
          dotnet run --project .\trainer-studio\tests\TrainerStudio.Windows.Tests\TrainerStudio.Windows.Tests.csproj -c Release

      - name: Upload Windows theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-studio-theme-checks
          path: release/theme-tests/*.png
          if-no-files-found: warn

      - name: Build release archive
        if: startsWith(github.ref, 'refs/tags/trainer-studio-v')
        shell: pwsh
        run: |
          $releaseDirectory = "release\TrainerStudio-win-x64"
          $archive = "release\Trainer-Studio-$env:GITHUB_REF_NAME-win-x64.zip"
          $checksum = "release\Trainer-Studio-$env:GITHUB_REF_NAME.sha256"

          dotnet publish .\trainer-studio\src\TrainerStudio.App\TrainerStudio.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $releaseDirectory

          $exeHash = (Get-FileHash "$releaseDirectory\TrainerStudio.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  TrainerStudio.exe" | Set-Content "$releaseDirectory\TrainerStudio.exe.sha256" -NoNewline
          Compress-Archive -Path "$releaseDirectory\*" -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$archiveHash  $(Split-Path $archive -Leaf)" | Set-Content $checksum -NoNewline

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/trainer-studio-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^trainer-studio-', ''
          gh release create "$env:GITHUB_REF_NAME" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Trainer Studio $version" `
            --notes "Windows-pakken indeholder TrainerStudio.exe og dens SHA-256-kontrolsum. Kildekoden kan hentes fra GitHubs automatiske Source code-arkiv for denne release." `
            "release\Trainer-Studio-$env:GITHUB_REF_NAME-win-x64.zip" `
            "release\Trainer-Studio-$env:GITHUB_REF_NAME.sha256" `
            "release\theme-tests\main-window.png"
